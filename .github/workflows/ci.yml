name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: TYPO3 ${{ matrix.typo3 }}, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - typo3: '13.4'
            php: '8.2'
          - typo3: '13.4'
            php: '8.4'
          - typo3: '14.3'
            php: '8.2'
          - typo3: '14.3'
            php: '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction \
            typo3/cms-core:^${{ matrix.typo3 }} \
            typo3/cms-backend:^${{ matrix.typo3 }} \
            typo3/cms-fluid:^${{ matrix.typo3 }}
          composer update --no-progress --no-interaction

      - name: Coding standards
        run: composer test:cs

      - name: PHPStan
        run: composer test:phpstan

      - name: Unit tests
        run: composer test:unit
