services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  B13\PageInfoTabs\:
    resource: ../Classes/*
    exclude: ../Classes/{Event,EventListener,Model}/*

  B13\PageInfoTabs\EventDispatcher\TrackingEventDispatcher:
    decorates: Psr\EventDispatcher\EventDispatcherInterface
    arguments:
      $inner: '@.inner'
