<html
	xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
	data-namespace-typo3-fluid="true"
>

<div class="page-info-tabs">
	<ul class="nav nav-tabs" role="tablist" id="page-info-tabs">
		<f:for each="{tabs}" as="tab" iteration="i">
			<li role="presentation" class="nav-item">
				<button
					type="button"
					id="page-info-tab-{tab.domId}-tab"
					class="nav-link{f:if(condition: i.isFirst, then: ' active')}"
					role="tab"
					data-bs-toggle="tab"
					data-bs-target="#page-info-tab-{tab.domId}"
					data-section-id="{tab.section.identifier}"
					aria-controls="page-info-tab-{tab.domId}"
					aria-selected="{f:if(condition: i.isFirst, then: 'true', else: 'false')}"
					tabindex="{f:if(condition: i.isFirst, then: '0', else: '-1')}"
				>
					<f:if condition="{tab.section.iconIdentifier}">
						<core:icon identifier="{tab.section.iconIdentifier}" size="small" />
					</f:if>
					{tab.section.label}
				</button>
			</li>
		</f:for>
	</ul>
	<div class="tab-content mt-3">
		<f:for each="{tabs}" as="tab" iteration="i">
			<div
				role="tabpanel"
				class="tab-pane{f:if(condition: i.isFirst, then: ' active')}"
				id="page-info-tab-{tab.domId}"
				aria-labelledby="page-info-tab-{tab.domId}-tab"
				tabindex="0"
			>
				<!-- page-info-tabs key: {tab.section.identifier} -->
				<f:format.raw>{tab.section.content}</f:format.raw>
			</div>
		</f:for>
	</div>
</div>

</html>
