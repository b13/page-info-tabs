<html
	xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	data-namespace-typo3-fluid="true"
>

<div role="tabpanel">
	<ul class="nav nav-tabs" role="tablist" id="page-info-tabs">
		<f:for each="{sections}" as="section" iteration="i">
			<li role="presentation" class="nav-item">
				<button
					type="button"
					class="nav-link{f:if(condition: i.isFirst, then: ' active')}"
					data-bs-toggle="tab"
					data-bs-target="#page-info-tab-{section.identifier}"
					data-section-id="{section.identifier}"
					aria-controls="page-info-tab-{section.identifier}"
					role="tab"
				>
					<f:if condition="{section.iconIdentifier}">
						<core:icon identifier="{section.iconIdentifier}" size="small" />
					</f:if>
					{section.label}
				</button>
			</li>
		</f:for>
	</ul>
	<div class="tab-content" style="margin-top: 1rem;">
		<f:for each="{sections}" as="section" iteration="i">
			<div
				role="tabpanel"
				class="tab-pane{f:if(condition: i.isFirst, then: ' active')}"
				id="page-info-tab-{section.identifier}"
			>
				<f:format.raw>{section.content}</f:format.raw>
			</div>
		</f:for>
	</div>
</div>

</html>
